name: Update casks

on:
  repository_dispatch:
    types: [update-cask]
  workflow_dispatch:
    inputs:
      cask:
        description: "Cask to update, or all"
        required: true
        default: "all"
        type: string
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: update-homebrew-casks
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-26
    env:
      REQUESTED_CASK: ${{ github.event.client_payload.cask || inputs.cask || 'all' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update casks
        run: python3 scripts/update_casks.py --cask "$REQUESTED_CASK"

      - name: Validate changed casks
        run: |
          ruby -c Casks/headsetcontrol-macostray.rb
          ruby -c Casks/stream-gui-rs.rb
          ruby -c Casks/toerings.rb
          brew style Casks/headsetcontrol-macostray.rb Casks/stream-gui-rs.rb Casks/toerings.rb

      - name: Commit and push cask updates
        run: |
          git add -- Casks/*.rb
          if git diff --cached --quiet; then
            echo "Casks are already up to date; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update homebrew casks"
          git push origin HEAD:main
